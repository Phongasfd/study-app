
events {
    worker_connections 1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ==========================================
    # Logging
    # ==========================================
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ==========================================
    # Performance
    # ==========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ==========================================
    # Gzip Compression
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss;

    # ==========================================
    # Upstreams
    # ==========================================
    # Docker's embedded DNS. With "resolve", nginx keeps re-resolving the backend names while
    # it runs: a recreated container (new IP after a deploy) is picked up within 10s, and an
    # instance that doesn't exist yet doesn't stop nginx from starting.
    # Needs nginx >= 1.27.3 (image pinned in docker-compose.prod.yml).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Stateless API + WebSocket: round-robin over both instances. Any instance can serve any
    # group's socket, because events are fanned out through Redis (backend ScalingConfig).
    # If one is down, nginx retries idempotent requests on the other (proxy_next_upstream default).
    upstream backend {
        zone backend 64k;
        server backend-1:8080 resolve;
        server backend-2:8080 resolve;
    }

    # Google sign-in is the one stateful flow: Spring keeps the OAuth2 authorization request in
    # the HTTP session of the instance that started it, so Google's callback must return to that
    # same instance. ip_hash pins a client to one instance for these two endpoints only.
    upstream backend_oauth {
        zone backend_oauth 64k;
        ip_hash;
        server backend-1:8080 resolve;
        server backend-2:8080 resolve;
    }

    upstream frontend {
        server frontend:80;
    }

    # ==========================================
    # Redirect HTTP → HTTPS
    # ==========================================
    server {

        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # ==========================================
    # Main HTTPS server
    # ==========================================
    server {

        listen 443 ssl;
        server_name _;

        # ==========================================
        # SSL
        # ==========================================
        ssl_certificate /etc/ssl/certs/study.crt;
        ssl_certificate_key /etc/ssl/private/study.key;

        # ==========================================
        # Security headers
        # ==========================================
        server_tokens off;

        client_max_body_size 20M;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ==========================================
        # Frontend (React/Vite static files)
        # ==========================================
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr; # overwrite: nginx is the edge, never trust a client-sent value
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # Google OAuth2 start + callback: sticky (see upstream backend_oauth)
        # A regex location wins over the /api/ prefix below.
        # ==========================================
        location ~ ^/api/(oauth2|login/oauth2)/ {

            proxy_pass http://backend_oauth;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr; # overwrite: nginx is the edge, never trust a client-sent value
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # Backend REST API
        # ==========================================
        location /api/ {

            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr; # overwrite: nginx is the edge, never trust a client-sent value
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ==========================================
        # WebSocket
        # ==========================================
        location /ws {

            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr; # overwrite: nginx is the edge, never trust a client-sent value
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
        }
    }
}
