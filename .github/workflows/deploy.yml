name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - Backend CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend Image
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            namphong134/study-app-backend:latest
            namphong134/study-app-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Image
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            namphong134/study-app-frontend:latest
            namphong134/study-app-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The server runs the compose file and nginx.conf from ~/study-app: ship the current ones
      - name: Copy compose and nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx.conf"
          target: "~/study-app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/study-app

            COMPOSE="docker compose -f docker-compose.prod.yml"

            $COMPOSE pull

            # infrastructure + frontend first; --no-deps so nginx doesn't restart both backends at once
            $COMPOSE up -d --remove-orphans --no-deps postgres mongodb redis frontend nginx
            $COMPOSE exec -T nginx nginx -s reload # pick up a changed nginx.conf

            # Rolling restart: one backend at a time, the other keeps serving (nginx skips the one
            # that is down). Flyway runs on the first one; migrations must stay compatible with
            # the previous release, which is still serving on the other instance meanwhile.
            for svc in backend-1 backend-2; do
              $COMPOSE up -d --no-deps "$svc"
              sleep 30 # no health endpoint yet: give Spring Boot time to start before the next one
            done

            docker ps

            docker image prune -af